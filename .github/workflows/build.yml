name: build

# Builds the worker image on GitHub's runners, never on a laptop.
# The CUDA base (~2.1 GB compressed) and, when SKIP_MODEL=0, the 10 GB weight
# are fetched by the runner, never by the person deploying.
#
# Push to GHCR by default. Runpod can then use
# ghcr.io/<owner>/humanizer-12b:latest as the template image, and deploy.sh
# takes IMAGE=... in the environment.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_model:
        description: "1 = no baked weights (volume supplies them), 0 = bake 10 GB"
        default: "1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/humanizer-12b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Make package public
        run: |
          sleep 10
          code=$(curl -s -o /tmp/vis.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/humanizer-12b \
            -d '{"visibility":"public"}')
          echo "visibility PATCH -> $code"; cat /tmp/vis.json || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKIP_MODEL=${{ github.event.inputs.skip_model || '1' }}
          # The weight layer is huge and changes only when the model changes;
          # keep it in the Actions cache so rebuilds do not refetch it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
